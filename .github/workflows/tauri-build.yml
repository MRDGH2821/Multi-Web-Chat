---
concurrency:
  cancel-in-progress: true
  group: ${{ github.ref }}-${{ github.workflow }}
jobs:
  tauri-build:
    name: ${{ matrix.name }}
    permissions:
      contents: read
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - args: ""
            artifact_path: src-tauri/target/release/bundle
            name: linux-x64
            platform: ubuntu-24.04
            rust_target: ""
          - args: ""
            artifact_path: src-tauri/target/release/bundle
            name: linux-arm64
            platform: ubuntu-24.04-arm
            rust_target: ""
          - args: ""
            artifact_path: src-tauri/target/release/bundle
            name: windows-x64
            platform: windows-latest
            rust_target: ""
          - args: ""
            artifact_path: src-tauri/target/release/bundle
            name: windows-arm64
            platform: windows-11-arm
            rust_target: ""
          - args: --target aarch64-apple-darwin
            artifact_path: src-tauri/target/aarch64-apple-darwin/release/bundle
            name: macos-arm64
            platform: macos-latest
            rust_target: aarch64-apple-darwin
          - args: --target x86_64-apple-darwin
            artifact_path: src-tauri/target/x86_64-apple-darwin/release/bundle
            name: macos-x64
            platform: macos-latest
            rust_target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            libssl-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            patchelf \
            build-essential \
            libfuse2 \
            file
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.rust_target }}
          toolchain: stable
      - name: Install frontend dependencies
        run: bun install
      - env:
          TAURI_ARGS: ${{ matrix.args }}
        name: Build installers
        run: |
          if [ -n "${TAURI_ARGS}" ]; then
            # TAURI_ARGS is a fixed matrix rustc target, not user input.
            # shellcheck disable=SC2086
            bun run tauri:build -- ${TAURI_ARGS}
          else
            bun run tauri:build
          fi
        shell: bash
      - if: success() || failure()
        name: Upload bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: warn
          name: multi-web-chat-${{ matrix.name }}
          path: ${{ matrix.artifact_path }}
name: Tauri build
on: # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:
permissions: {}
