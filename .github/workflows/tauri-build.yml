---
concurrency:
  cancel-in-progress: true
  group: ${{ github.ref }}-${{ github.workflow }}
jobs:
  tauri-build:
    name: Build packages
    permissions:
      contents: read
    uses: ./.github/workflows/tauri-packages.yml
    with:
      ref: ${{ github.ref }}
name: Tauri build
on: # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
permissions: {}
